name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      # Fails if the runner's Node 22 is older than the October 2026 security release (22.23.4).
      - run: node -e "const [a,b,c]=process.versions.node.split('.').map(Number);if(a===22&&(b<23||(b===23&&c<4))){console.error('Node '+process.versions.node+' is older than 22.23.4');process.exit(1)}"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Supply chain: no known high or critical vulnerability, and every package carries a valid registry signature.
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  # The server rules of sync (version ordering, refusing an out-of-date edit, sealed records, deletions) against a real PostgreSQL.
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/test-sql.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

  # In a real browser: with "Protect this device" on, nothing readable is left in IndexedDB (locked or unlocked), the right
  # password and the recovery key open the app, and no content-policy or Trusted Types violation occurs.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Nothing readable on disk
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:4173/ npm run e2e:vault
          BASE_URL=http://localhost:4173/ npm run e2e:audit
          BASE_URL=http://localhost:4173/ npm run e2e:quota
          npm run e2e:update
          npm run check:reproducible
